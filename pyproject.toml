[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-agent"
version = "0.3.0"
description = "Information-flow oriented agent workflow runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0,<2.0", "httpx>=0.28,<0.29"]

[tool.setuptools.packages.find]
include = ["easy_agent*"]
